[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "portable-webtoolbox"
version = "0.2.0"
description = "Embeddable async search, crawl, and structured extraction for Python apps"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{name = "Portable Web Toolbox contributors"}]
dependencies = ["httpx>=0.27,<1", "beautifulsoup4>=4.12,<5"]

[project.optional-dependencies]
search = ["ddgs>=9,<12"]
browser = ["crawl4ai>=0.9,<1"]
all = ["ddgs>=9,<12", "crawl4ai>=0.9,<1"]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.23,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
