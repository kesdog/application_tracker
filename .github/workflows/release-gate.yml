name: Release gate
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-gate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    uses: ./.github/workflows/ci.yml
  release-gate:
    name: release-gate
    needs: checks
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require cross-platform checks
        env:
          RESULT: ${{ needs.checks.result }}
        run: test "$RESULT" = success
