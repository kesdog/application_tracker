name: Approve phone PWA deployment
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published version tag to promote
        required: true
        type: string
permissions:
  contents: read
  attestations: read
concurrency:
  group: phone-production
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && github.repository == 'kesdog/application_tracker'
    environment: phone-production
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - name: Download and verify published artifact provenance
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)\.[0-9]+)?$ ]]
          test "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = false
          gh release download "$TAG" --pattern ApplicationTracker-phone.zip --dir .run/phone
          gh attestation verify .run/phone/ApplicationTracker-phone.zip --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" --source-ref "refs/tags/$TAG" --deny-self-hosted-runners
      - name: Promote static public files atomically
        env:
          TAG: ${{ inputs.tag }}
          PHONE_SSH_KEY: ${{ secrets.PHONE_SSH_KEY }}
          PHONE_SSH_KNOWN_HOSTS: ${{ secrets.PHONE_SSH_KNOWN_HOSTS }}
          PHONE_SSH_HOST: ${{ vars.PHONE_SSH_HOST }}
          PHONE_DEPLOY_ROOT: ${{ vars.PHONE_DEPLOY_ROOT }}
          PHONE_PUBLIC_URL: ${{ vars.PHONE_PUBLIC_URL }}
        run: |
          test -n "$PHONE_SSH_KEY" && test -n "$PHONE_SSH_KNOWN_HOSTS"
          [[ "$PHONE_PUBLIC_URL" == https://* ]]
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$PHONE_SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$PHONE_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
          trap 'rm -f ~/.ssh/id_ed25519' EXIT
          bash scripts/deploy-phone.sh .run/phone/ApplicationTracker-phone.zip "${TAG#v}"
          curl --fail --retry 3 "$PHONE_PUBLIC_URL/phone/manifest.webmanifest" -o .run/deployed-manifest.json
          python -c 'import json,os; assert json.load(open(".run/deployed-manifest.json"))["version"] == os.environ["TAG"][1:]'
