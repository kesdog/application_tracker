name: Locked toolchain
description: Install the same hashed Python and frozen frontend dependencies everywhere
inputs:
  frontend:
    default: 'true'
    description: Install frontend tools too
runs:
  using: composite
  steps:
    - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
      with:
        python-version: '3.13.17'
        cache: pip
        cache-dependency-path: requirements-dev.lock
    - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
      if: inputs.frontend == 'true'
      with:
        node-version: '24.19.0'
    - shell: bash
      run: |
        python -m venv .venv
        if [ "$RUNNER_OS" = Windows ]; then cygpath -w "$PWD/.venv/Scripts" >> "$GITHUB_PATH"; py=.venv/Scripts/python.exe; else echo "$PWD/.venv/bin" >> "$GITHUB_PATH"; py=.venv/bin/python; fi
        "$py" -m pip install --require-hashes -r requirements-dev.lock
        "$py" -m pip install --no-deps --no-build-isolation -e . -e libs/portable-webtoolbox-embedded-v0.7.0/webtoolbox-embedded
    - if: inputs.frontend == 'true'
      shell: bash
      run: |
        npm install -g pnpm@11.19.0
        pnpm --dir frontend install --frozen-lockfile
