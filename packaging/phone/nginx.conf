# Inside an existing HTTPS server {} with a configured certificate and public name.
# Replace this root with PHONE_DEPLOY_ROOT/current. No backend proxy is required.
root /srv/application-tracker-phone/current;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy no-referrer always;
add_header Cross-Origin-Opener-Policy same-origin-allow-popups always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://accounts.google.com; style-src 'self' 'unsafe-inline' https://accounts.google.com; connect-src 'self' https://www.googleapis.com https://openidconnect.googleapis.com https://accounts.google.com; frame-src https://accounts.google.com; img-src 'self' data: https://*.googleusercontent.com; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
location /phone/ {
    expires -1;
    try_files $uri $uri/ /phone/index.html;
}
location /assets/ {
    expires 1y;
    try_files $uri =404;
}
location /icons/ { try_files $uri =404; }
location = / { return 302 /phone/; }
location / { return 404; }
