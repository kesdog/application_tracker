[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "application-tracker"
version = "0.10.0"
description = "Local application tracker"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "sqlalchemy>=2.0,<3",
    "pydantic-settings>=2.7,<3",
    "alembic>=1.13,<2",
    "openpyxl>=3.1,<4",
    "python-multipart>=0.0.20,<1",
    "mcp>=1.20,<2",
    "phonenumberslite>=9.0.40,<10",
    "httpx>=0.28,<1",
    "extruct>=0.18,<1",
    "playwright>=1.50,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<1"]
desktop = ["pystray>=0.19,<1", "Pillow>=11,<13"]
build-desktop = ["pyinstaller>=6,<7"]
posting-browser = []

[project.scripts]
application-tracker = "app.main:run"
application-tracker-mcp = "app.mcp_server:run"
application-tracker-desktop = "app.desktop:run"

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
